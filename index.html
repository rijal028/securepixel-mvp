<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePixel - Forensic Pre-Filter</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 50px auto; padding: 20px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h1 { margin-top: 0; font-size: 22px; color: #38bdf8; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .upload-box { border: 2px dashed #475569; padding: 25px; border-radius: 12px; text-align: center; cursor: pointer; background: #0f172a; margin-bottom: 20px; }
        input[type="file"] { display: none; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #resultCard { display: none; margin-top: 25px; padding-top: 20px; border-top: 1px solid #334155; }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; }
        .badge-verified { background: #065f46; color: #34d399; }
        .badge-inconclusive { background: #7f1d1d; color: #fca5a5; }
        .badge-proceed { background: #1e3a8a; color: #60a5fa; }
        pre { background: #0b0f19; color: #a5f3fc; padding: 15px; border-radius: 8px; font-size: 12px; overflow-x: auto; border: 1px solid #1e293b; }
    </style>
</head>
<body>

<div class="card">
    <h1>🛡️ SecurePixel Pre-Filter</h1>
    <p class="subtitle">Tahap 1 & 2: Pemeriksaan Manifes C2PA & Profiler Degradasi (CPU-Only Pre-filter).</p>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <span id="uploadLabel">📁 Klik di sini untuk memilih gambar</span>
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelected(event)">
    </div>

    <button type="button" id="btnSubmit" onclick="submitAnalysis()" disabled>Analisis Berkas</button>

    <div id="resultCard">
        <p><strong>Verdict:</strong> <span id="resVerdict" class="badge"></span></p>
        <p><strong>Keterangan:</strong> <span id="resReason" style="color: #cbd5e1;"></span></p>
        <p><strong>Status GPU:</strong> <span id="resGPU" style="font-weight: 600;"></span></p>
        <p style="margin-top: 15px; font-size: 13px; color: #94a3b8;">Metrik Fisik Citra:</p>
        <pre id="resMetrics"></pre>
    </div>
</div>

<script>
    let selectedFile = null;

    function handleFileSelected(e) {
        if (e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            const sizeMB = (selectedFile.size / (1024 * 1024)).toFixed(2);
            document.getElementById('uploadLabel').innerText = `✅ ${selectedFile.name} (${sizeMB} MB)`;
            document.getElementById('btnSubmit').disabled = false;
        }
    }

    async function submitAnalysis() {
        if (!selectedFile) return;

        // Cegah pengunggahan file di atas batas 4.5 MB Vercel
        if (selectedFile.size > 4.2 * 1024 * 1024) {
            alert(`Ukuran berkas (${(selectedFile.size / (1024*1024)).toFixed(2)} MB) melebihi batas fungsi serverless Vercel (4.2 MB). Silakan gunakan berkas di bawah 4 MB untuk uji coba MVP.`);
            return;
        }

        const btn = document.getElementById('btnSubmit');
        const resultCard = document.getElementById('resultCard');
        btn.innerText = "Memproses berkas...";
        btn.disabled = true;

        const formData = new FormData();
        formData.append("file", selectedFile);

        try {
            const res = await fetch("/api/analyze", { method: "POST", body: formData });
            
            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Server status ${res.status}: ${errText}`);
            }

            const data = await res.json();

            resultCard.style.display = "block";
            const verdictEl = document.getElementById('resVerdict');
            verdictEl.innerText = data.verdict;

            if (data.verdict === "VERIFIED ORIGIN") {
                verdictEl.className = "badge badge-verified";
            } else if (data.verdict === "INCONCLUSIVE") {
                verdictEl.className = "badge badge-inconclusive";
            } else {
                verdictEl.className = "badge badge-proceed";
            }

            document.getElementById('resReason').innerText = data.reason;
            document.getElementById('resGPU').innerText = data.send_to_gpu ? "⚡ Ya (Memenuhi syarat untuk diteruskan ke GPU)" : "🛡️ Tidak (Hemat daya komputasi)";
            document.getElementById('resMetrics').innerText = JSON.stringify(data.metrics || data.c2pa_info || {}, null, 2);
        } catch (err) {
            alert("Eror memeriksa berkas: " + err.message);
        } finally {
            btn.innerText = "Analisis Berkas";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
